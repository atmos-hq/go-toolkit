name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"

      # Same pinned install.sh pattern as the shared go-ci.yml — the
      # old `go install` line had a typo'd module owner
      # (golangci-lint/golangci-lint) and compiled from source besides.
      # Keep this version in lockstep with go-ci.yml's default.
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Validate .golangci.yml
        run: golangci-lint config verify --config .golangci.yml

      - name: Validate common.mk syntax
        run: make -n -f common.mk all 2>&1 | head -20 || true
